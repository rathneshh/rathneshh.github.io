<title>Rathneshwaran K. V.</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --plum-deep: #4a2c40;
    --plum: #5c374c;
    --peach: #ecc9a9;
    --cream: #fdf0de;
    --pink: #dfbcc0;
    --sand: #e8d9cc;
    --rule: #efd9bf;
    --focus: #3f8f89;
    --backdrop: #5a3a4f;
    --backdrop-check: #523349;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    color: var(--plum-deep);
    background-color: var(--backdrop);
    background-image:
      conic-gradient(var(--backdrop-check) 25%, transparent 0 50%, var(--backdrop-check) 0 75%, transparent 0);
    background-size: 8px 8px;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }

  .window {
    width: 100%;
    max-width: 560px;
    background: var(--cream);
    border: 2px solid var(--peach);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    align-self: flex-start;
  }

  .titlebar {
    background: var(--plum);
    color: var(--peach);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
  }

  .dots { display: flex; gap: 10px; }
  .dots span { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .dots span:nth-child(1) { background: var(--peach); }
  .dots span:nth-child(2) { background: var(--pink); }
  .dots span:nth-child(3) { background: var(--sand); }

  .hero { padding: 40px 36px 36px; }

  h1 {
    margin: 0 0 22px;
    font-size: clamp(3.2rem, 14vw, 5rem);
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .tagline {
    margin: 0;
    max-width: 44ch;
    font-size: 1rem;
    line-height: 1.6;
    color: var(--plum);
  }

  hr { border: 0; border-top: 2px solid var(--rule); margin: 0; }

  nav { padding: 32px 36px; display: grid; gap: 14px; }

  .link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 20px 26px;
    border-radius: 8px;
    text-decoration: none;
    color: var(--plum);
    font-size: 1rem;
    font-weight: 500;
    transition: transform 0.15s ease;
  }
  .link svg { flex: none; width: 20px; height: 20px; transition: transform 0.15s ease; }
  .link:hover svg { transform: translateX(4px); }

  .link.l1 { background: var(--plum); color: var(--peach); }
  .link.l2 { background: var(--peach); }
  .link.l3 { background: var(--pink); }
  .link.l4 { background: var(--sand); }

  footer { padding: 28px 36px 36px; display: flex; gap: 14px; flex-wrap: wrap; }

  .icon {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    background: var(--peach);
    color: var(--plum);
    display: grid;
    place-items: center;
  }
  .icon svg { width: 24px; height: 24px; }
  .icon:hover { background: var(--pink); }

  a:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 3px;
  }

  @media (max-width: 480px) {
    body { padding: 24px 12px; }
    .hero, nav, footer { padding-left: 22px; padding-right: 22px; }
    .link { padding: 18px 18px; font-size: 0.92rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .link, .link svg { transition: none; }
  }
</style>
</head>
